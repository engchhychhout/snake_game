<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Car Racing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #333;
            overflow: hidden;
            border: 4px solid #fff;
        }
        #road {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #444;
            background-image: linear-gradient(90deg, transparent 48%, #fff 48%, #fff 52%, transparent 52%);
            background-size: 100% 40px;
            animation: moveRoad 0.5s linear infinite;
        }
        @keyframes moveRoad {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }
        .car {
            position: absolute;
            width: 40px;
            height: 70px;
            background-color: #e74c3c;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .car::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 5px;
            right: 5px;
            height: 15px;
            background: #222;
            border-radius: 2px;
        }
        .car::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 5px;
            right: 5px;
            height: 10px;
            background: #222;
            border-radius: 2px;
        }
        #player {
            bottom: 20px;
            left: 180px;
            background-color: #3498db;
        }
        .enemy {
            background-color: #2ecc71;
            top: -80px;
        }
        #ui {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            gap: 30px;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }
        #game-over h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #e74c3c;
        }
        #game-over button {
            padding: 10px 20px;
            font-size: 16px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
        }
        #game-over button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="road"></div>
        <div id="player" class="car"></div>
        <div id="game-over">
            <h2>GAME OVER</h2>
            <p id="final-score" style="margin-bottom: 20px;">Score: 0</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Controls: ← → / A D</div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const road = document.getElementById('road');

        let playerX = 180;
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let keys = {};
        let enemies = [];

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function spawnEnemy() {
            if (isGameOver) return;
            
            const enemy = document.createElement('div');
            enemy.classList.add('car', 'enemy');
            
            // Lanes: 60px, 180px, 300px
            const lanes = [60, 180, 300];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            enemy.style.left = randomLane + 'px';
            enemy.style.top = '-80px';
            
            gameContainer.appendChild(enemy);
            enemies.push({ element: enemy, x: randomLane, y: -80 });

            // Spawn rate gets slightly faster as score increases
            let spawnInterval = Math.max(1000, 2000 - (score * 10));
            setTimeout(spawnEnemy, spawnInterval);
        }

        function update() {
            if (isGameOver) return;

            // Player Movement
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && playerX > 40) {
                playerX -= 6;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && playerX < 320) {
                playerX += 6;
            }
            player.style.left = playerX + 'px';

            // Move Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                en.y += gameSpeed;
                en.element.style.top = en.y + 'px';

                // Check Collision
                if (
                    playerX < en.x + 40 &&
                    playerX + 40 > en.x &&
                    20 < en.y + 70 &&
                    20 + 70 > en.y
                ) {
                    endGame();
                }

                // Remove off-screen enemies and update score
                if (en.y > 600) {
                    en.element.remove();
                    enemies.splice(i, 1);
                    score += 10;
                    scoreDisplay.textContent = score;
                    
                    // Gradually increase game speed
                    if (score % 50 === 0) {
                        gameSpeed += 0.5;
                        road.style.animationDuration = Math.max(0.1, 0.5 - (score/500)) + 's';
                    }
                }
            }

            requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.textContent = 'Score: ' + score;
            road.style.animationPlayState = 'paused';
        }

        function resetGame() {
            enemies.forEach(en => en.element.remove());
            enemies = [];
            playerX = 180;
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            scoreDisplay.textContent = score;
            gameOverScreen.style.display = 'none';
            road.style.animationPlayState = 'running';
            road.style.animationDuration = '0.5s';
            requestAnimationFrame(update);
            setTimeout(spawnEnemy, 1000);
        }

        // Initialize game loop
        setTimeout(spawnEnemy, 1000);
        requestAnimationFrame(update);
    </script>
</body>
</html>
